name: Promote oxem-stable

# Ставит ghcr.io/romzes5000/portabase-agent:oxem-stable на тег из STABLE.
# Агенты на хостах Oxem подтягивают :oxem-stable сами (portabase-agent-update).
# Менять STABLE только после канарейки на fml.
on:
  push:
    branches: [oxem/stable]

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag
        run: |
          tag=$(tr -d '[:space:]' < STABLE)
          src=ghcr.io/romzes5000/portabase-agent:$tag
          docker buildx imagetools inspect "$src" >/dev/null
          docker buildx imagetools create -t ghcr.io/romzes5000/portabase-agent:oxem-stable "$src"
          docker buildx imagetools inspect ghcr.io/romzes5000/portabase-agent:oxem-stable
