name: Mirror upstream agent

# Копирует теги ghcr.io/portabase/agent из MIRROR (по одному на строку) в
# ghcr.io/romzes5000/portabase-agent под тем же тегом. Хосты Oxem тянут только
# наш GHCR (Docker Hub с FatMetal бывает недоступен), поэтому апстримный
# релиз сначала зеркалится, проверяется на канарейке fml и только потом
# попадает в STABLE.
on:
  push:
    branches: [oxem/stable]
    paths: [MIRROR]

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Mirror
        run: |
          grep -v -E '^\s*(#|$)' MIRROR | while read -r tag; do
            docker buildx imagetools create -t "ghcr.io/romzes5000/portabase-agent:$tag" "ghcr.io/portabase/agent:$tag"
            docker buildx imagetools inspect "ghcr.io/romzes5000/portabase-agent:$tag" | head -3
          done
